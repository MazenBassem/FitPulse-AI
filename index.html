<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitPulse AI Engine</title>
    <!-- Fuse.js CDN for client-side fuzzy search matching -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020617;
        --panel: rgba(15, 23, 42, 0.72);
        --panel-strong: rgba(15, 23, 42, 0.96);
        --border: rgba(51, 65, 85, 0.88);
        --border-strong: rgba(16, 185, 129, 0.35);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #34d399;
        --accent-strong: #10b981;
        --danger: #fb7185;
        --shadow: 0 24px 80px rgba(2, 6, 23, 0.6);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          Inter,
          Segoe UI,
          system-ui,
          sans-serif;
        background:
          radial-gradient(
            circle at top left,
            rgba(16, 185, 129, 0.14),
            transparent 28%
          ),
          radial-gradient(
            circle at top right,
            rgba(45, 212, 191, 0.12),
            transparent 26%
          ),
          linear-gradient(180deg, #020617 0%, #030712 100%);
        color: var(--text);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.05) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.8),
          transparent 95%
        );
        opacity: 0.35;
      }

      .app {
        width: min(1120px, calc(100vw - 24px));
        margin: 0 auto;
        padding: 24px 0 28px;
      }

      .header {
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        padding-bottom: 18px;
        margin-bottom: 20px;
      }

      .brand {
        display: flex;
        gap: 14px;
        align-items: center;
        min-width: 0;
      }

      .brand-icon {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.2);
        box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.04) inset;
        color: var(--accent);
        font-size: 21px;
      }

      .brand h1 {
        margin: 0;
        font-size: clamp(1.1rem, 2vw, 1.6rem);
        line-height: 1.15;
        background: linear-gradient(90deg, #34d399 0%, #99f6e4 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .brand p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .header-controls {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .api-input {
        width: min(300px, 35vw);
        max-width: 100%;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(51, 65, 85, 0.8);
        color: #cbd5e1;
        border-radius: 14px;
        padding: 10px 14px;
        font-size: 0.88rem;
        outline: none;
      }

      .api-input:focus,
      .query-input:focus,
      .upload-label:hover,
      .preset:hover,
      .send:hover,
      .stop-btn:hover,
      .remove:hover,
      .bookmark-toggle-btn:hover {
        border-color: var(--border-strong);
      }

      /* Bookmarked Saved Drawer Header Badge Button (Source 1 inspired) */
      .bookmark-toggle-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid var(--border);
        color: #cbd5e1;
        padding: 10px 14px;
        border-radius: 14px;
        cursor: pointer;
        font-size: 0.88rem;
        font-weight: 600;
        transition: all 160ms ease;
      }

      .bookmark-toggle-btn.active {
        background: rgba(16, 185, 129, 0.15);
        border-color: var(--accent);
        color: var(--accent);
      }

      .bookmark-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        background: #ef4444;
        color: #ffffff;
        font-size: 0.72rem;
        font-weight: 700;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        border: 2px solid #020617;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
        align-items: start;
      }

      @media (min-width: 900px) {
        .grid {
          grid-template-columns: 340px 1fr;
        }

        .stack-sidebar {
          position: sticky;
          top: 24px;
        }
      }

      .stack {
        display: grid;
        gap: 14px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .card-inner {
        padding: 18px;
      }

      .card h2,
      .card h3 {
        margin: 0 0 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.95rem;
        color: #e2e8f0;
      }

      .label-icon {
        color: var(--accent);
      }

      .upload-label {
        display: grid;
        place-items: center;
        text-align: center;
        min-height: 128px;
        width: 100%;
        border: 2px dashed rgba(51, 65, 85, 0.95);
        border-radius: 18px;
        cursor: pointer;
        background: rgba(15, 23, 42, 0.28);
        transition: 160ms ease;
        padding: 14px;
      }

      .upload-label .muted {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .upload-label .tiny {
        color: #64748b;
        font-size: 0.72rem;
        margin-top: 4px;
      }

      .hidden {
        display: none !important;
      }

      .preview-wrap {
        position: relative;
        overflow: hidden;
        border-radius: 18px;
        border: 1px solid rgba(16, 185, 129, 0.24);
        background: rgba(2, 6, 23, 0.9);
        padding: 10px;
      }

      .preview-wrap img {
        width: 100%;
        height: 176px;
        object-fit: cover;
        border-radius: 12px;
        display: block;
      }

      .badge-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        color: #34d399;
        font-size: 0.8rem;
      }

      .remove {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 34px;
        height: 34px;
        border-radius: 999px;
        border: 1px solid rgba(51, 65, 85, 0.8);
        background: rgba(2, 6, 23, 0.82);
        color: #cbd5e1;
        cursor: pointer;
      }

      .preset-list {
        display: grid;
        gap: 10px;
      }

      .preset {
        width: 100%;
        text-align: left;
        padding: 12px 12px;
        border-radius: 14px;
        border: 1px solid rgba(51, 65, 85, 0.7);
        background: rgba(30, 41, 59, 0.52);
        color: #cbd5e1;
        cursor: pointer;
        transition: 160ms ease;
        font-size: 0.85rem;
        line-height: 1.35;
        gap: 10px;
      }

      .query-form {
        display: flex;
        gap: 10px;
      }

      .query-input {
        flex: 1;
        min-width: 0;
        border-radius: 16px;
        border: 1px solid rgba(51, 65, 85, 0.8);
        background: rgba(15, 23, 42, 0.96);
        color: #f8fafc;
        padding: 14px 16px;
        font-size: 0.98rem;
        outline: none;
      }

      .send {
        min-width: 120px;
        border: 1px solid rgba(16, 185, 129, 0.3);
        border-radius: 16px;
        background: linear-gradient(180deg, #34d399 0%, #10b981 100%);
        color: #052e1a;
        font-weight: 800;
        padding: 0 18px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .send:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .stop-btn {
        min-width: 100px;
        border: 1px solid rgba(251, 113, 133, 0.4);
        border-radius: 16px;
        background: linear-gradient(180deg, #fb7185 0%, #e11d48 100%);
        color: #ffffff;
        font-weight: 800;
        padding: 0 18px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: 160ms ease;
      }

      .response {
        height: calc(100vh - 220px);
        min-height: 480px;
        max-height: 720px;
        background: rgba(15, 23, 42, 0.52);
        border: 1px solid rgba(51, 65, 85, 0.9);
        border-radius: 22px;
        padding: 22px;
        overflow-y: auto;
        line-height: 1.7;
        color: #dbe4f0;
      }

      /* Integrated Photo Gallery & Dynamic Image Kit Styling (Source 2 inspired) */
      .gallery-wrapper {
        position: relative;
        width: 100%;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid rgba(51, 65, 85, 0.7);
        background: rgba(2, 6, 23, 0.95);
        margin-bottom: 12px;
        cursor: pointer;
      }

      .gallery-wrapper img {
        width: 100%;
        max-height: 220px;
        object-fit: cover;
        display: block;
        transition: filter 200ms ease;
      }

      .gallery-wrapper.loading img {
        filter: blur(4px);
      }

      .gallery-badge {
        position: absolute;
        bottom: 10px;
        right: 10px;
        background: rgba(2, 6, 23, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #e2e8f0;
        font-size: 0.72rem;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 999px;
        pointer-events: none;
      }

      .gallery-cycle-icon {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(2, 6, 23, 0.75);
        color: #34d399;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 13px;
        pointer-events: none;
      }

      /* Collapsible Instructions Component (Source 3 inspired) */
      .instructions-container {
        margin-top: 10px;
      }

      .instructions-collapsed p,
      .instructions-collapsed li {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Collapsible Instructions Component */

      .instructions-hidden {
        display: none;
      }

      .instructions-toggle-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--accent);
        background: transparent;
        border: none;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        padding: 4px 0;
        margin-top: 4px;
      }

      .instructions-toggle-btn:hover {
        text-decoration: underline;
      }

      /* Exercise Card & Bookmark Styling (Source 1 inspired) */
      .exercise-card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin: 16px 0;
        padding: 18px;
        background: rgba(15, 23, 42, 0.96);
        border: 1px solid rgba(16, 185, 129, 0.28);
        border-radius: 18px;
        box-shadow: 0 12px 28px rgba(2, 6, 23, 0.22);
      }

      .exercise-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .exercise-title-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .exercise-bookmark-btn {
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 1.25rem;
        padding: 4px;
        display: grid;
        place-items: center;
        transition:
          color 150ms ease,
          transform 150ms ease;
      }

      .exercise-bookmark-btn:hover {
        transform: scale(1.15);
        color: #f59e0b;
      }

      .exercise-bookmark-btn.bookmarked {
        color: #f59e0b;
      }

      .thinking-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        height: 100%;
        min-height: 360px;
        gap: 22px;
        text-align: center;
        padding-top: 28px;
      }

      .orb-wrap {
        position: relative;
        width: 64px;
        height: 64px;
        flex: 0 0 auto;
      }

      .orb-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          rgba(52, 211, 153, 0.95) 90deg,
          transparent 170deg,
          rgba(45, 212, 191, 0.75) 260deg,
          transparent 360deg
        );
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 6px),
          #000 calc(100% - 6px)
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 6px),
          #000 calc(100% - 6px)
        );
        animation: orbSpin 2.4s linear infinite;
      }

      .orb-core {
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #a7f3d0,
          #34d399 45%,
          #059669 85%
        );
        box-shadow:
          0 0 18px rgba(52, 211, 153, 0.55),
          0 0 42px rgba(16, 185, 129, 0.32);
        animation: orbBreathe 2.2s ease-in-out infinite;
      }

      @keyframes orbSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes orbBreathe {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.92;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }

      .thinking-phrase-wrap {
        min-height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .thinking-text {
        font-size: 0.92rem;
        color: var(--accent);
        font-weight: 600;
        letter-spacing: 0.01em;
        animation: phraseFade 2.2s ease-in-out;
      }

      @keyframes phraseFade {
        0% {
          opacity: 0;
          transform: translateY(5px);
        }
        18% {
          opacity: 1;
          transform: translateY(0);
        }
        82% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateY(-5px);
        }
      }

      .skeleton-stack {
        width: 100%;
        max-width: 480px;
        display: grid;
        gap: 10px;
        margin-top: 4px;
      }

      .skeleton-line,
      .skeleton-card {
        border-radius: 8px;
        background: linear-gradient(
          90deg,
          rgba(51, 65, 85, 0.28) 25%,
          rgba(100, 116, 139, 0.5) 37%,
          rgba(51, 65, 85, 0.28) 63%
        );
        background-size: 400% 100%;
        animation: skeletonShimmer 1.7s ease-in-out infinite;
      }

      .skeleton-line {
        height: 12px;
      }

      .skeleton-title {
        height: 16px;
        width: 42%;
        margin-bottom: 2px;
      }

      .skeleton-card {
        height: 60px;
        border-radius: 14px;
      }

      @keyframes skeletonShimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .markdown img.response-img {
        max-width: 100%;
        height: auto;
        border-radius: 16px;
        border: 1px solid var(--border);
        margin: 14px 0;
        display: block;
        box-shadow: 0 12px 32px rgba(2, 6, 23, 0.4);
      }

      .markdown h1,
      .markdown h2,
      .markdown h3,
      .markdown h4 {
        margin: 16px 0 10px;
        line-height: 1.25;
      }

      .markdown h1 {
        font-size: 1.45rem;
      }
      .markdown h2 {
        font-size: 1.2rem;
      }
      .markdown h3 {
        font-size: 1.05rem;
      }
      .markdown p {
        margin: 0 0 12px;
      }

      .markdown ul,
      .markdown ol {
        margin: 0 0 12px 20px;
        padding: 0;
      }

      .markdown li {
        margin: 4px 0;
      }

      .markdown blockquote {
        margin: 0 0 12px;
        padding: 10px 14px;
        border-left: 3px solid rgba(16, 185, 129, 0.45);
        background: rgba(15, 23, 42, 0.72);
        border-radius: 0 12px 12px 0;
        color: #cbd5e1;
      }

      .markdown code {
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(51, 65, 85, 0.85);
        border-radius: 8px;
        padding: 0.12rem 0.35rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.9em;
      }

      .markdown pre {
        margin: 0 0 12px;
        padding: 14px;
        overflow: auto;
        border-radius: 14px;
        background: rgba(2, 6, 23, 0.95);
        border: 1px solid rgba(51, 65, 85, 0.95);
      }

      .markdown pre code {
        display: block;
        border: 0;
        background: transparent;
        padding: 0;
      }

      .markdown a {
        color: #6ee7b7;
        text-decoration: none;
      }

      .markdown a:hover {
        text-decoration: underline;
      }

      .markdown hr {
        border: 0;
        height: 1px;
        margin: 18px 0;
        background: rgba(51, 65, 85, 0.9);
      }

      .empty-state {
        min-height: 386px;
        display: grid;
        place-items: center;
        color: #64748b;
        text-align: center;
        gap: 10px;
      }

      .glow {
        font-size: 34px;
        color: #475569;
      }

      .exercise-icon {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: rgba(16, 185, 129, 0.12);
        color: var(--accent);
        flex: 0 0 auto;
      }

      .exercise-title {
        font-size: 1rem;
        color: #bbf7d0;
        font-weight: 700;
        margin: 0;
      }

      .exercise-id {
        margin: 2px 0 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        color: #94a3b8;
      }

      .tag {
        font-size: 0.72rem;
        color: #cbd5e1;
        background: rgba(51, 65, 85, 0.9);
        padding: 4px 10px;
        border-radius: 999px;
        white-space: nowrap;
        transition: 200ms ease;
        flex: 0 0 auto;
      }

      .tag-live {
        color: #6ee7b7;
        background: rgba(16, 185, 129, 0.2);
      }

      .tag-missing {
        color: #94a3b8;
        background: rgba(51, 65, 85, 0.55);
      }

      .status {
        margin-top: 12px;
        font-size: 0.82rem;
        color: #94a3b8;
      }

      .error {
        color: var(--danger);
      }

      /* Welcome Widget Styles */
      .welcome-overlay {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.88);
        backdrop-filter: blur(14px);
        display: grid;
        place-items: center;
        z-index: 9999;
        padding: 20px;
        transition:
          opacity 250ms ease,
          visibility 250ms ease;
      }

      .welcome-overlay.hidden-widget {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .welcome-card {
        background: rgba(15, 23, 42, 0.96);
        border: 1px solid var(--border-strong);
        box-shadow: 0 32px 96px rgba(0, 0, 0, 0.7);
        border-radius: 28px;
        padding: 36px 32px;
        max-width: 440px;
        width: 100%;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .welcome-logo {
        margin-bottom: 16px;
      }

      .welcome-logo .brand-icon {
        width: 64px;
        height: 64px;
        font-size: 28px;
        border-radius: 20px;
      }

      .welcome-card h2 {
        margin: 0 0 8px;
        font-size: 1.5rem;
        background: linear-gradient(90deg, #34d399 0%, #99f6e4 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .welcome-card p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .welcome-input-group {
        width: 100%;
        text-align: left;
        margin-bottom: 20px;
      }

      .welcome-input-group label {
        display: block;
        font-size: 0.76rem;
        font-weight: 700;
        color: #94a3b8;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .welcome-input-group input {
        width: 100%;
      }

      .welcome-btn {
        width: 100%;
        height: 48px;
        font-size: 0.98rem;
      }
    </style>
  </head>
  <body>
    <!-- Welcome Setup Widget Overlay -->
    <div id="welcomeWidget" class="welcome-overlay">
      <div class="welcome-card">
        <div class="welcome-logo">
          <img
            src="assets/logo.png"
            alt="FitPulse AI Logo"
            class="brand-icon"
            width="64"
            height="64"
          />
          <!-- <div class="brand-icon">❤</div> -->
        </div>
        <h2>Welcome to FitPulse AI</h2>
        <p>
          Your AI assistant powered by Qwen2.5 & InBody RAG. Connect your
          backend endpoint to begin.
        </p>

        <div class="welcome-input-group">
          <label for="welcomeApiUrl">Ngrok Tunnel Endpoint</label>
          <input
            id="welcomeApiUrl"
            class="query-input"
            type="text"
            value="https://gumdrop-paralyses-replica.ngrok-free.dev/api/chat"
            placeholder="https://your-ngrok-url.ngrok-free.dev/api/chat"
          />
        </div>

        <button id="welcomeConnectBtn" class="send welcome-btn" type="button">
          Connect & Get Started →
        </button>

    <div class="app">

      <main class="grid">

    <script>
      // 1. Global state & catalog storage
      let exerciseCatalog = [];
      let fuseSearchInstance = null; // Fuse.js instance (Source 1 inspired)
      let savedExercises = []; // localStorage persistence (Source 1 inspired)
      let galleryState = {}; // Gallery current index state per exercise (Source 2 inspired)
      let instructionState = {}; // Collapsible instruction state per exercise (Source 3 inspired)
      let showingSavedOnly = false; // Filter state for saved items
      let abortController = null; // Controller to cancel active fetch stream requests

      // Restore saved exercises from localStorage on init (Source 1 inspired)
      if (localStorage.getItem("savedExercises")) {
        try {
          savedExercises = JSON.parse(localStorage.getItem("savedExercises"));
        } catch (e) {
          savedExercises = [];
        }
      }

      // Sync saved exercises to localStorage (Source 1 inspired)
      function syncSavedExercises() {
        localStorage.setItem("savedExercises", JSON.stringify(savedExercises));
        updateBookmarkBadge();
      }

      function updateBookmarkBadge() {
        const badge = document.getElementById("bookmarkBadge");
        if (badge) badge.textContent = savedExercises.length;
      }

      function isBookmarked(exerciseIdOrName) {
        if (!exerciseIdOrName) return false;
        const target = String(exerciseIdOrName).toLowerCase().trim();
        return savedExercises.some(
          (item) =>
            item.id?.toLowerCase() === target ||
            item.name?.toLowerCase() === target,
        );
      }

      function toggleBookmark(exercise) {
        const targetId = exercise.id || exercise.name;
        if (isBookmarked(targetId)) {
          savedExercises = savedExercises.filter(
            (item) => (item.id || item.name) !== targetId,
          );
        } else {
          savedExercises.push(exercise);
        }
        syncSavedExercises();
        renderResponse();
      }

      // 2. Load Exercise Catalog & initialize Fuse.js search (Source 1 inspired)
      async function initExerciseCatalog() {
        try {
          const res = await fetch(
            "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json",
          );
          exerciseCatalog = await res.json();
          console.log(
            `Loaded ${exerciseCatalog.length} exercises into catalog.`,
          );

          // Initialize Fuse.js for fuzzy search fallback (Source 1 inspired)
          fuseSearchInstance = new Fuse(exerciseCatalog, {
            keys: ["id", "name"],
            threshold: 0.3,
          });
        } catch (err) {
          console.warn("Could not pre-load exercise catalog:", err);
        }
      }

      // 3. Exact and Fuzzy Exercise Catalog Lookup (Source 1 Fuse.js inspired)
      function findCatalogExercise(exerciseIdOrName) {
        if (!exerciseCatalog.length || !exerciseIdOrName) return null;

        const target = String(exerciseIdOrName).toLowerCase().trim();
        const cleanTarget = target.replace(/[\s_-]+/g, "");

        // Exact match check
        const exactMatch = exerciseCatalog.find((ex) => {
          const cleanId = ex.id.toLowerCase().replace(/[\s_-]+/g, "");
          const cleanName = ex.name.toLowerCase().replace(/[\s_-]+/g, "");
          return cleanId === cleanTarget || cleanName === cleanTarget;
        });

        if (exactMatch) return exactMatch;

        // Fuzzy match search fallback using Fuse.js (Source 1 inspired)
        if (fuseSearchInstance) {
          const results = fuseSearchInstance.search(target);
          if (results.length > 0) {
            return results[0].item;
          }
        }

        return null;
      }

      // 4. ImageKit CDN URL Resolver (Source 2 PhotoGallery inspired)
      // Generates ImageKit dynamically resized URLs with srcset support
      function getImageKitUrl(imagePath, transform = "") {
        if (!imagePath) return "";
        if (/^https?:\/\//i.test(imagePath)) return imagePath;
        const cleanPath = imagePath.replace(/^\//, "");
        const prefix = transform ? `tr:${transform}/` : "";
        return `https://ik.imagekit.io/yuhonas/${prefix}${cleanPath}`;
      }

      const state = {
        query: "",
        apiUrl: document.getElementById("apiUrl").value.trim(),
        inbodyPreview: null,
        inbodyImageBase64: null,
        response: "",
        loading: false,
      };

      const presets = [
        "Analyze my InBody graph & recommend a fat loss meal strategy",
        "Design a targeted workout split based on my SMM & PBF",
        "What are my daily calorie and macro targets based on my BMR?",
      ];

      const thinkingPhrases = [
        "Warming up the analysis engine...",
        "Reading your InBody scan closely...",
        "Crunching SMM & body fat numbers...",
        "Consulting the macro oracle...",
        "Calculating BMR & calorie targets...",
        "Sketching out a training split...",
        "Balancing protein, carbs & gains...",
        "Cross-checking the exercise catalog...",
        "Polishing the final plan...",
      ];

      let thinkingInterval = null;
      let thinkingPhraseIndex = 0;

      const uploadArea = document.getElementById("uploadArea");
      const presetsPane = document.getElementById("presets");
      const responsePane = document.getElementById("responsePane");
      const statusPane = document.getElementById("status");
      const queryInput = document.getElementById("query");
      const apiUrlInput = document.getElementById("apiUrl");
      const queryForm = document.getElementById("queryForm");
      const sendBtn = document.getElementById("sendBtn");
      const sendLabel = document.getElementById("sendLabel");
      const stopBtn = document.getElementById("stopBtn");
      const toggleBookmarksBtn = document.getElementById("toggleBookmarksBtn");

      function startThinkingAnimation() {
        thinkingPhraseIndex = 0;
        renderThinkingState();
        thinkingInterval = setInterval(() => {
          thinkingPhraseIndex =
            (thinkingPhraseIndex + 1) % thinkingPhrases.length;
          updateThinkingPhrase();
        }, 2200);
      }

      function stopThinkingAnimation() {
        if (thinkingInterval) {
          clearInterval(thinkingInterval);
          thinkingInterval = null;
        }
      }

      function renderThinkingState() {
        if (!state.loading || state.response) return;
        responsePane.innerHTML = `
      <div class="thinking-container">
        <div class="orb-wrap">
          <div class="orb-ring"></div>
          <div class="orb-core"></div>
        </div>
        <div class="thinking-phrase-wrap">
          <div class="thinking-text" id="thinkingTextEl">✨ ${thinkingPhrases[thinkingPhraseIndex]}</div>
        </div>
        <div class="skeleton-stack">
          <div class="skeleton-line skeleton-title"></div>
          <div class="skeleton-line" style="width:94%"></div>
          <div class="skeleton-line" style="width:80%"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-line" style="width:88%"></div>
          <div class="skeleton-line" style="width:62%"></div>
        </div>
      </div>
    `;
      }

      function updateThinkingPhrase() {
        if (!state.loading || state.response) return;
        const el = document.getElementById("thinkingTextEl");
        if (!el) {
          renderThinkingState();
          return;
        }
        el.style.animation = "none";
        el.textContent = `✨ ${thinkingPhrases[thinkingPhraseIndex]}`;
        void el.offsetWidth;
        el.style.animation = "";
      }

      function setStatus(message, isError = false) {
        statusPane.textContent = message;
        statusPane.className = isError ? "status error" : "status";
      }

      function escapeHtml(text) {
        return text
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function escapeAttr(text) {
        return escapeHtml(String(text ?? ""));
      }

      function formatInline(text) {
        let output = escapeHtml(text);

        output = output.replace(/`([^`]+)`/g, "<code>$1</code>");
        output = output.replace(
          /!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g,
          '<img class="response-img" src="$2" alt="$1" loading="lazy" />',
        );
        output = output.replace(
          /&lt;img\s+([^&]*?)src=["'](https?:\/\/[^"'\s]+)["']([^&]*?)\/?&gt;/gi,
          '<img class="response-img" src="$2" loading="lazy" />',
        );
        output = output.replace(
          /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
          '<a href="$2" target="_blank" rel="noreferrer noopener">$1</a>',
        );
        output = output.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        output = output.replace(/__([^_]+)__/g, "<strong>$1</strong>");
        return output;
      }

      function splitExerciseTag(content) {
        const tagPattern = /\[EXERCISE:\s*(\{[\s\S]*?\})\s*\]/gi;
        const segments = [];
        let lastIndex = 0;
        let match;

        while ((match = tagPattern.exec(content)) !== null) {
          if (match.index > lastIndex) {
            segments.push({
              type: "text",
              value: content.slice(lastIndex, match.index),
            });
          }
          segments.push({
            type: "exercise",
            value: match[0],
            jsonPayload: match[1],
          });
          lastIndex = match.index + match[0].length;
        }

        if (lastIndex < content.length) {
          segments.push({ type: "text", value: content.slice(lastIndex) });
        }

        return segments;
      }

      // Event handler for Gallery photos cycling on click (Source 2 PhotoGallery inspired)
      window.nextGalleryPhoto = function (cardKey, photosCount) {
        if (!galleryState[cardKey])
          galleryState[cardKey] = { index: 0, loading: false };
        galleryState[cardKey].loading = true;
        galleryState[cardKey].index =
          (galleryState[cardKey].index + 1) % photosCount;
        renderResponse();
      };

      // Called on image loaded event to clear blur effect (Source 2 PhotoGallery inspired)
      window.onGalleryImageLoad = function (cardKey) {
        if (galleryState[cardKey]) {
          galleryState[cardKey].loading = false;
          const wrapper = document.getElementById(`gallery-${cardKey}`);
          if (wrapper) wrapper.classList.remove("loading");
        }
      };

      // Toggle expandable exercise instructions (Source 3 ExerciseInstructions inspired)
      window.toggleInstructions = function (cardKey) {
        instructionState[cardKey] = !instructionState[cardKey];
        renderResponse();
      };

      // Toggle bookmark status (Source 1 SearchBar inspired)
      window.handleBookmarkClick = function (exerciseJsonEncoded) {
        const exercise = JSON.parse(decodeURIComponent(exerciseJsonEncoded));
        toggleBookmark(exercise);
      };

      function renderMarkdownBlock(lines) {
        let output = "";
        let listType = null;
        let listItems = [];

        const flushList = () => {
          if (!listType) return;
          output += `<${listType}>${listItems.join("")}</${listType}>`;
          listType = null;
          listItems = [];
        };

        for (let index = 0; index < lines.length; index += 1) {
          const line = lines[index];

          if (!line.trim()) {
            flushList();
            continue;
          }

          const heading = line.match(/^(#{1,4})\s+(.*)$/);
          if (heading) {
            flushList();
            const level = heading[1].length;
            output += `<h${level}>${formatInline(heading[2])}</h${level}>`;
            continue;
          }

          if (/^>\s?/.test(line)) {
            flushList();
            const quoteLines = [line.replace(/^>\s?/, "")];
            while (index + 1 < lines.length && /^>\s?/.test(lines[index + 1])) {
              index += 1;
              quoteLines.push(lines[index].replace(/^>\s?/, ""));
            }
            output += `<blockquote>${quoteLines.map((quote) => formatInline(quote)).join("<br>")}</blockquote>`;
            continue;
          }

          if (/^```/.test(line)) {
            flushList();
            const codeLines = [];
            while (index + 1 < lines.length && !/^```/.test(lines[index + 1])) {
              index += 1;
              codeLines.push(lines[index]);
            }
            index += 1;
            output += `<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`;
            continue;
          }

          const unordered = line.match(/^[-*+]\s+(.*)$/);
          if (unordered) {
            if (!unordered[1].trim()) continue;
            if (listType !== "ul") {
              flushList();
              listType = "ul";
            }
            listItems.push(`<li>${formatInline(unordered[1])}</li>`);
            continue;
          }

          const ordered = line.match(/^\d+\.\s+(.*)$/);
          if (ordered) {
            if (!ordered[1].trim()) continue;
            if (listType !== "ol") {
              flushList();
              listType = "ol";
            }
            listItems.push(`<li>${formatInline(ordered[1])}</li>`);
            continue;
          }

          flushList();
          const paragraphLines = [line];
          while (
            index + 1 < lines.length &&
            lines[index + 1].trim() &&
            !/^(#{1,4})\s+/.test(lines[index + 1]) &&
            !/^>\s?/.test(lines[index + 1]) &&
            !/^```/.test(lines[index + 1]) &&
            !/^[-*+]\s+/.test(lines[index + 1]) &&
            !/^\d+\.\s+/.test(lines[index + 1])
          ) {
            index += 1;
            paragraphLines.push(lines[index]);
          }
          output += `<p>${paragraphLines.map((p) => formatInline(p)).join("<br>")}</p>`;
        }

        flushList();
        return output;
      }

      // Render individual exercise card with merged features from Sources 1, 2, and 3
      function renderExerciseCardHTML(exercise, cardKey) {
        const catalogMatch = findCatalogExercise(exercise.id || exercise.name);
        const mergedExercise = { ...(catalogMatch || {}), ...exercise };

        const exerciseName =
          mergedExercise.name || mergedExercise.id || "Exercise";
        const exerciseId = mergedExercise.id || "unknown";
        const photos =
          Array.isArray(mergedExercise.images) &&
          mergedExercise.images.length > 0
            ? mergedExercise.images
            : [];

        // Gallery index tracking (Source 2 PhotoGallery inspired)
        if (!galleryState[cardKey]) {
          galleryState[cardKey] = { index: 0, loading: false };
        }
        const currentIndex = galleryState[cardKey].index;
        const isLoading = galleryState[cardKey].loading;

        // ImageKit Responsive URLs & Srcset (Source 2 inspired)
        let galleryHTML = "";
        if (photos.length > 0) {
          const currentPhotoPath = photos[currentIndex];
          const mainSrc = getImageKitUrl(currentPhotoPath);
          const srcSet = `${getImageKitUrl(currentPhotoPath)} 850w, ${getImageKitUrl(currentPhotoPath, "w-250,h-180")} 200w`;

          galleryHTML = `
            <div id="gallery-${cardKey}" class="gallery-wrapper ${isLoading ? "loading" : ""}" onclick="nextGalleryPhoto('${cardKey}', ${photos.length})" title="Click to view next photo">
              ${photos.length > 1 ? '<div class="gallery-cycle-icon">🔄</div>' : ""}
              <img
                src="${escapeAttr(mainSrc)}"
                srcset="${escapeAttr(srcSet)}"
                sizes="(min-width: 765px) 200px, 850px"
                alt="${escapeAttr(exerciseName)}"
                loading="lazy"
                onload="onGalleryImageLoad('${cardKey}')"
              />
              ${photos.length > 1 ? `<div class="gallery-badge">${currentIndex + 1} / ${photos.length}</div>` : ""}
            </div>
          `;
        }

        // Instructions formatting (Source 3 ExerciseInstructions inspired)
        // Instructions formatting (Hidden by default, toggle button shown first)
        const instructions = Array.isArray(mergedExercise.instructions)
          ? mergedExercise.instructions
          : typeof mergedExercise.instructions === "string"
            ? [mergedExercise.instructions]
            : [];

        const isExpanded = !!instructionState[cardKey];
        let instructionsHTML = "";
        if (instructions.length > 0) {
          instructionsHTML = `
    <div class="instructions-container">
      <button class="instructions-toggle-btn" onclick="toggleInstructions('${cardKey}')" type="button">
        ${isExpanded ? "Hide Instructions ▲" : "Show Instructions ▼"}
      </button>
      <div class="${!isExpanded ? "instructions-hidden" : ""}">
        <ol class="markdown" style="margin: 8px 0 4px 18px;">
          ${instructions.map((step) => `<li>${formatInline(step)}</li>`).join("")}
        </ol>
      </div>
    </div>
  `;
        }

        const bookmarked =
          isBookmarked(exerciseId) || isBookmarked(exerciseName);
        const encodedExercise = encodeURIComponent(
          JSON.stringify(mergedExercise),
        );

        return `
          <div class="exercise-card">
            <div class="exercise-header">
              <div class="exercise-title-group">
                <div class="exercise-icon">🏋️</div>
                <div>
                  <h4 class="exercise-title">${escapeHtml(exerciseName)}</h4>
                  <p class="exercise-id">ID: ${escapeHtml(exerciseId)}</p>
                </div>
              </div>
              <button
                class="exercise-bookmark-btn ${bookmarked ? "bookmarked" : ""}"
                onclick="handleBookmarkClick('${encodedExercise}')"
                type="button"
                title="${bookmarked ? "Remove Bookmark" : "Bookmark Exercise"}"
              >
                ${bookmarked ? "★" : "☆"}
              </button>
            </div>
            ${galleryHTML}
            ${instructionsHTML}
          </div>
        `;
      }

      function renderMarkdownContent(content) {
        const lastTagStart = content.lastIndexOf("[EXERCISE:");
        if (lastTagStart !== -1 && content.indexOf("]", lastTagStart) === -1) {
          content = content.slice(0, lastTagStart).trimEnd();
        }

        const parts = splitExerciseTag(content);
        let cardCount = 0;

        return parts
          .map((part) => {
            if (part.type !== "exercise") {
              return renderMarkdownBlock(part.value.split(/\r?\n/));
            }

            try {
              const jsonString =
                part.jsonPayload ||
                part.value.match(/^\[EXERCISE:\s*(\{.*\})\]$/s)?.[1];
              if (!jsonString) {
                return renderMarkdownBlock(part.value.split(/\r?\n/));
              }

              const exercise = JSON.parse(jsonString);
              cardCount += 1;
              const cardKey = `ex-${cardCount}-${exercise.id || exercise.name || "item"}`;
              return renderExerciseCardHTML(exercise, cardKey);
            } catch (err) {
              return renderMarkdownBlock(part.value.split(/\r?\n/));
            }
          })
          .join("");
      }

      function renderUploadArea() {
        if (!state.inbodyPreview) {
          uploadArea.innerHTML = `
        <label class="upload-label" for="fileInput">
          <div>
            <div style="font-size:30px;margin-bottom:6px;color:#64748b">📄</div>
            <div class="muted">Upload Scan Image (.png, .jpg, .webp)</div>
            <div class="tiny">Parses Muscle-Fat Graphs & Metrics</div>
          </div>
          <input id="fileInput" class="hidden" type="file" accept="image/png, image/jpeg, image/webp" />
        </label>
      `;
          document
            .getElementById("fileInput")
            .addEventListener("change", handleFileUpload);
          return;
        }

        uploadArea.innerHTML = `
      <div class="preview-wrap">
        <img src="${state.inbodyPreview}" alt="InBody Scan Preview" />
        <button class="remove" id="removeBtn" type="button">×</button>
        <div class="badge-row">✓ <span>Scan image attached to context</span></div>
      </div>
    `;
        document
          .getElementById("removeBtn")
          .addEventListener("click", removeInbodyImage);
      }

      function renderPresets() {
        presetsPane.innerHTML = presets
          .map(
            (preset) => `
          <button class="preset" type="button" data-preset="${escapeHtml(preset)}">${escapeHtml(preset)}</button>
        `,
          )
          .join("");

        presetsPane.querySelectorAll(".preset").forEach((button) => {
          button.addEventListener("click", () => {
            queryInput.value = button.dataset.preset || "";
            state.query = queryInput.value;
          });
        });
      }

      function renderSavedExercisesView() {
        if (savedExercises.length === 0) {
          responsePane.innerHTML = `
            <div class="empty-state">
              <div class="glow">🔖</div>
              <div>No bookmarked exercises yet. Click the ☆ icon on any exercise card to save it!</div>
            </div>
          `;
          return;
        }

        let html = `<h3>🔖 Saved Exercises (${savedExercises.length})</h3>`;
        savedExercises.forEach((ex, idx) => {
          html += renderExerciseCardHTML(
            ex,
            `saved-${idx}-${ex.id || ex.name}`,
          );
        });
        responsePane.innerHTML = `<div class="markdown">${html}</div>`;
      }

      function renderResponse() {
        if (showingSavedOnly) {
          renderSavedExercisesView();
          return;
        }

        if (!state.response) {
          if (state.loading) {
            renderThinkingState();
          } else {
            responsePane.innerHTML = `
          <div class="empty-state">
            <div class="glow">✨</div>
            <div>Submit a request to generate workout or diet plans</div>
          </div>
        `;
          }
          return;
        }

        const isAtBottom =
          responsePane.scrollHeight -
            responsePane.scrollTop -
            responsePane.clientHeight <
          80;

        responsePane.innerHTML = `<div class="markdown">${renderMarkdownContent(state.response)}</div>`;

        if (isAtBottom) {
          responsePane.scrollTop = responsePane.scrollHeight;
        }
      }

      function removeInbodyImage() {
        state.inbodyPreview = null;
        state.inbodyImageBase64 = null;
        renderUploadArea();
        setStatus("InBody image removed.");
      }

      function handleFileUpload(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onloadend = () => {
          state.inbodyPreview = reader.result;
          state.inbodyImageBase64 = reader.result;
          renderUploadArea();
          setStatus("InBody image attached to context.");
        };
        reader.readAsDataURL(file);
      }

      function stopGeneration() {
        if (abortController) {
          abortController.abort();
          abortController = null;
        }
        stopThinkingAnimation();
        state.loading = false;
        sendBtn.disabled = false;
        sendLabel.textContent = "Send";
        stopBtn.classList.add("hidden");
        sendBtn.classList.remove("hidden");
        setStatus("Generation stopped by user.");
      }

      async function handleSubmit(event) {
        event.preventDefault();
        showingSavedOnly = false;
        toggleBookmarksBtn.classList.remove("active");

        state.query = queryInput.value.trim();
        state.apiUrl = apiUrlInput.value.trim();

        if (!state.query) {
          setStatus("Enter a prompt before sending.", true);
          return;
        }

        abortController = new AbortController();
        state.loading = true;
        state.response = "";
        startThinkingAnimation();
        sendBtn.disabled = true;
        sendBtn.classList.add("hidden");
        stopBtn.classList.remove("hidden");
        setStatus("Connecting to backend...");

        try {
          const res = await fetch(state.apiUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "69420",
            },
            body: JSON.stringify({
              query: state.query,
              inbody_image: state.inbodyImageBase64,
              use_rag: true,
            }),
            signal: abortController.signal,
          });

          if (!res.ok) throw new Error(`HTTP error: ${res.status}`);
          if (!res.body)
            throw new Error("Streaming response body unavailable.");

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value, { stream: true });
            if (chunk) {
              if (thinkingInterval) stopThinkingAnimation();
              state.response += chunk;
              renderResponse();
            }
          }
          state.response += decoder.decode();
          renderResponse();
          setStatus("Response complete.");
        } catch (error) {
          stopThinkingAnimation();
          if (error.name === "AbortError") {
            console.log("Fetch aborted by user.");
            return;
          }
          state.response =
            "❌ Error connecting to backend server. Verify your API endpoint URL and CORS settings.";
          renderResponse();
          setStatus(error.message || "Request failed.", true);
        } finally {
          stopThinkingAnimation();
          state.loading = false;
          sendBtn.disabled = false;
          sendLabel.textContent = "Send";
          stopBtn.classList.add("hidden");
          sendBtn.classList.remove("hidden");
          abortController = null;
        }
      }

      stopBtn.addEventListener("click", stopGeneration);

      toggleBookmarksBtn.addEventListener("click", () => {
        showingSavedOnly = !showingSavedOnly;
        toggleBookmarksBtn.classList.toggle("active", showingSavedOnly);
        renderResponse();
      });

      apiUrlInput.addEventListener("change", () => {
        state.apiUrl = apiUrlInput.value.trim();
      });
      queryInput.addEventListener("input", () => {
        state.query = queryInput.value;
      });
      queryForm.addEventListener("submit", handleSubmit);

      document.getElementById("mockTestBtn").addEventListener("click", () => {
        state.loading = false;
        showingSavedOnly = false;
        toggleBookmarksBtn.classList.remove("active");

        state.response = `
### 🏋️ Test Plan Verification (Vue Components Integrated)

1. **Barbell Bench Press (Catalog Match + Multi-Photo Gallery + Instructions):**
[EXERCISE: {"id": "Barbell_Bench_Press", "name": "Barbell Bench Press"}]

2. **Incline Dumbbell Press (Fuse.js Fuzzy Match Fallback):**
[EXERCISE: {"id": "Incline Dumbell Bench Press", "name": "Incline Dumbbell Press"}]
    `;
        renderResponse();
        setStatus("Injected test payload into response pane.");
      });
      const labelScanBtn = document.getElementById("labelScanBtn");
      const labelFileInput = document.getElementById("labelFileInput");

      if (labelScanBtn && labelFileInput) {
        labelScanBtn.addEventListener("click", () => {
          labelFileInput.click();
        });

        labelFileInput.addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const queryInput = document.getElementById("queryInput");
          if (queryInput) {
            queryInput.value = `[Uploaded Nutrition Label: ${file.name}] - Please analyze macros and calories from this label.`;
          }

          if (typeof setStatus === "function") {
            setStatus(`Label uploaded: ${file.name}`);
          }
        });
      }

      // Welcome Widget Handler
      const welcomeWidget = document.getElementById("welcomeWidget");
      const welcomeApiUrlInput = document.getElementById("welcomeApiUrl");
      const welcomeConnectBtn = document.getElementById("welcomeConnectBtn");

      // Auto-restore saved endpoint if user has configured it previously
      const savedApiUrl = localStorage.getItem("fitpulse_api_url");
      if (savedApiUrl) {
        apiUrlInput.value = savedApiUrl;
        welcomeApiUrlInput.value = savedApiUrl;
        state.apiUrl = savedApiUrl;
      }

      welcomeConnectBtn.addEventListener("click", () => {
        const url = welcomeApiUrlInput.value.trim();
        if (url) {
          apiUrlInput.value = url;
          state.apiUrl = url;
          localStorage.setItem("fitpulse_api_url", url);
        }
        welcomeWidget.classList.add("hidden-widget");
      });

      // App initialization
      initExerciseCatalog();
      updateBookmarkBadge();
      renderUploadArea();
      renderPresets();
      renderResponse();
    </script>
  </body>
</html>
